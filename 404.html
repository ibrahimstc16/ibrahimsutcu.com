<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · İbrahim Sütcü</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--bg:#0b0c0e;--fg:#f3f2ee;--muted:#a1a1a6;--accent:#e3b778;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Geist",system-ui,sans-serif;display:grid;place-items:center;padding:0 16px;text-align:center}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(4rem,14vw,8rem);line-height:1;margin:0;color:var(--accent)}
p{color:var(--muted);margin:16px 0 28px}
a{display:inline-flex;height:46px;align-items:center;padding:0 22px;border-radius:999px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:500}
a:hover{background:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Aradığınız sayfa burada değil.</p>
  <a href="/">Ana sayfaya dön</a>
</main>
</body>
</html>
